name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install terminal backends
        run: sudo apt-get update && sudo apt-get install -y tmux screen
      - run: pnpm install --frozen-lockfile
      # Same pipeline as `pnpm test` locally: format, lint, typecheck, vitest, go.
      - run: pnpm test
      - run: pnpm build
      - name: Committed web assets are up to date
        run: git diff --exit-code -- internal/webui/dist
      - name: Screen persistence integration
        run: |
          screen -v || true
          WMUX_SCREEN_INTEGRATION=1 go test -timeout 30s ./internal/terminal -run '^TestScreenSessionSurvivesManagerCloseAndTerminateKillsIt$' -count=1 -v
      - name: Tmux restore integration
        # Runs even when the screen step fails so one CI run reports both backends.
        if: always()
        run: WMUX_TMUX_INTEGRATION=1 go test -timeout 60s ./internal/terminal -run '^(TestTmuxSessionSurvivesManagerRestoreAndTerminateKillsIt|TestLocalTmuxGivesEachSessionItsOwnEnvironment|TestLocalTmuxAttachOnlyReportsMissingSession)$' -count=1 -v
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
